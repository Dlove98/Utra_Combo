name: Continuous Match Aggregator

on:
  schedule:
    - cron: '0 8 * * *'  # Exécution tous les matins à 08h00 UTC
  workflow_dispatch:      # Permet de lancer le script manuellement depuis GitHub

jobs:
  update-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and process matches
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python fetch_matches.py

      - name: Commit and push updated matches JSON
        run: |
          git config --global user.name "D_Tech Bot"
          git config --global user.email "bot@dtech.com"
          git add public/data.json
          git commit -m "auto: Mise à jour des matchs du jour [skip ci]" || exit 0
          git push
